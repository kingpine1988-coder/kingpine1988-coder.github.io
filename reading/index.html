", "c2": "#5aa9ff", "url": "https://kingpine1988-coder.github.io/reading/posts/p018.html"}, {"id": "p019", "book": "人性的弱点", "author": "", "subtitle": "你越想让别人喜欢你，越没人真喜欢", "title": "读书笔记 ｜《人性的弱点》：你越想让别人喜欢你，越没人真喜欢", "excerpt": "一本写了近百年的「人际相处手册」：它不教你怎么把话说漂亮，而是提醒你——大多数关系的冷场，都因为我们太忙着表达自己，却忘了先去看见对面那个人。", "category": "心理与成长", "tags": ["总觉得嘴笨的人", "要带团队、协调人的", "想经营长久关系的", "容易在亲密关系里说重话的", "刚步入职场的新人"], "date": "2026-08-21", "c1": "#f78ca0", "c2": "#f9748f", "url": "https://kingpine1988-coder.github.io/reading/posts/p019.html"}, {"id": "p020", "book": "人间失格", "author": "", "subtitle": "你越想被所有人喜欢，越活丢了自己", "title": "读书笔记 ｜《人间失格》：你越想被所有人喜欢，越活丢了自己", "excerpt": "太宰治写了一个少爷，拼尽全力让所有人满意，最后却被所有人当成\"不存在\"。这不是一本教人丧气的书，而是一面把\"讨好型活法\"照得清清楚楚的镜子——你演得越像别人喜欢的样子，藏在后面的那个真人，就越没人看得见。", "category": "文学小说", "tags": ["习惯性讨好的人", "总怕\"扫了别人兴\"的人", "把情绪藏得很深的人", "想读懂\"丧\"背后那点真的人", "读过却不敢承认共鸣的读者"], "date": "2026-09-13", "c1": "#f6d365", "c2": "#fda085", "url": "https://kingpine1988-coder.github.io/reading/posts/p020.html"}, {"id": "p021", "book": "以日为鉴", "author": "", "subtitle": "你焦虑的，30年前的日本人都经历过", "title": "读书笔记 ｜《以日为鉴》：你焦虑的，30年前的日本人都经历过", "excerpt": "我们这代人爱说「时代的一粒沙」。这本书最狠的地方，是把邻国那粒沙摊开给你看它怎么变成山的——然后告诉你，山脚下的人，后来都怎么走的。", "category": "历史", "tags": ["对「职业该怎么选」犯合计的人", "在考公/考研/跳槽之间摇摆", "想看懂经济周期与自身关系", "喜欢用邻国历史照见当下", "不想被焦虑带着跑、想多支点的人"], "date": "2026-08-10", "c1": "#f6d365", "c2": "#fda085", "url": "https://kingpine1988-coder.github.io/reading/posts/p021.html"}, {"id": "p022", "book": "全球视野下的投资机会", "author": "", "subtitle": "真正的机会，藏在看不见的\"势\"里", "title": "读书笔记 ｜《全球视野下的投资机会》：真正的机会，藏在看不见的\"势\"里", "excerpt": "这不是一本教人「买什么」的书，而是一本教人「怎么看世界」的书——当你看得足够远，很多眼前的焦虑会自己退场。", "category": "投资与商业", "tags": ["关心大趋势的人", "想建立全局视野", "长期主义者", "对宏观经济好奇", "不想被热点牵着走", "想理解财富流动逻辑"], "date": "2026-08-10", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p022.html"}, {"id": "p023", "book": "全球通史", "author": "斯塔夫里阿诺斯", "subtitle": "一部把世界连成一张网的通史", "title": "读书笔记 ｜《全球通史》斯塔夫里阿诺斯：一部把世界连成一张网的通史", "excerpt": "一本让你把\"世界\"重新看一遍的书：它不把历史切成一国一段的碎片，而是追踪文明之间怎样传播、碰撞、互相牵动——读懂这张网，你才读懂自己站在哪里。", "category": "历史", "tags": ["世界史爱好者", "宏观视野", "通史入门", "文明观察者", "打破认知边界", "深度阅读者"], "date": "2026-11-22", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p023.html"}, {"id": "p024", "book": "刀锋", "author": "", "subtitle": "你越把日子过稳，越怕问一句为什么", "title": "读书笔记 ｜《刀锋》：你越把日子过稳，越怕问一句为什么", "excerpt": "一个从战场活着回来的年轻人，忽然没法再装作什么都信。他退了婚、辞了体面的工作、把安稳的未来一把推开，只想去把\"人到底该怎么活\"这件事，亲自想明白。毛姆用一群人的人生，把这道题摊开在你面前——不是给你答案，是逼你承认自己从没认真问过。", "category": "文学小说", "tags": ["对现状隐隐不安的人", "在安稳与热爱间拉扯的人", "读过《月亮与六便士》想看毛姆另一面", "常想\"人到底该怎么活\"的人", "不想被标准答案绑架的人"], "date": "2026-08-22", "c1": "#43cea2", "c2": "#185a9d", "url": "https://kingpine1988-coder.github.io/reading/posts/p024.html"}, {"id": "p025", "book": "动物农场", "author": "", "subtitle": "你守的规矩，别人早改了", "title": "读书笔记 ｜《动物农场》：你守的规矩，别人早改了", "excerpt": "一个关于「理想怎么被自己人一点点改坏」的寓言。它不教你恨谁，只提醒你：墙上的字，是谁在偷偷改。", "category": "文学小说", "tags": ["警惕「共识」的人", "带过团队的人", "爱读寓言讽刺文学的人", "想看懂话术逻辑的人", "普通但不想被代表的人"], "date": "2026-08-17", "c1": "#ffb86b", "c2": "#ff7a9c", "url": "https://kingpine1988-coder.github.io/reading/posts/p025.html"}, {"id": "p026", "book": "半小时漫画世界史", "author": "陈磊", "subtitle": "为什么世界史乱成一团，读完却串成一条线？", "title": "读书笔记 ｜《半小时漫画世界史》陈磊：为什么世界史乱成一团，读完却串成一条线？", "excerpt": "一部把几千年世界史画成段子的漫画书：它不逼你背年代，而是先把你逗笑，再让你在笑声里悄悄记住那条从河谷文明一路延伸到今天的主线。历史没那么难，难的是没人愿意先用你能懂的方式讲一遍。", "category": "历史", "tags": ["历史没学好的人", "一背年份就头疼的人", "想给孩子讲历史的人", "通史入门读者", "碎片时间阅读者"], "date": "2026-11-17", "c1": "#f78ca0", "c2": "#f9748f", "url": "https://kingpine1988-coder.github.io/reading/posts/p026.html"}, {"id": "p027", "book": "半小时漫画中国史", "author": "", "subtitle": "历史太枯燥？这本书让你笑着记住", "title": "读书笔记 ｜《半小时漫画中国史》：历史太枯燥？这本书让你笑着记住", "excerpt": "一堆让你头大的朝代、帝王、年号，被画成了一本让人笑出声的漫画。二混子用段子和画面，把中国历史那条最难的线索，捋成了普通人也能一口气读完的故事——它是\"入门砖\"，不是\"历史学\"，但足以让你不再怕历史。", "category": "历史", "tags": ["历史零基础的人", "一读史书就犯困的人", "想给孩子讲历史的家长", "通勤路上想轻松读点东西的人"], "date": "2026-11-16", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p027.html"}, {"id": "p028", "book": "原子习惯", "author": "", "subtitle": "你每天改1%，一年后强37倍", "title": "读书笔记 ｜《原子习惯》：你每天改1%，一年后强37倍", "excerpt": "一本把\"养成好习惯\"从靠意志力硬扛，改写为靠系统自动运转的实操手册。它不喊口号，只给一套能落进每天早晨的动作——微信读书 89.1% 推荐，值得每一个总在\"重新开始\"的人翻一遍。", "category": "心理与成长", "tags": ["总也养不成习惯的人", "年年立flag又倒的人", "想靠系统而非意志力的人", "带团队建流程的管理者", "想慢慢变好的人"], "date": "2026-11-11", "c1": "#8f7cff", "c2": "#5aa9ff", "url": "https://kingpine1988-coder.github.io/reading/posts/p028.html"}, {"id": "p029", "book": "反对本本主义", "author": "", "subtitle": "为什么\"照着书做\"反而会坏事", "title": "读书笔记 ｜《反对本本主义》：为什么\"照着书做\"反而会坏事", "excerpt": "这篇文章的著名论断是\"没有调查，就没有发言权\"，而它的锋芒指向一种常见的毛病：把书本和上级的话当成万能答案，不问实际情况就照搬。这套反思，放到今天的工作里依然扎心。", "category": "毛选与思想", "tags": ["做管理和决策的人", "刚接手新岗位的人", "容易被\"标准答案\"困住的人", "信奉实事求是的人"], "date": "2026-11-16", "c1": "#ffc371", "c2": "#ff5f6d", "url": "https://kingpine1988-coder.github.io/reading/posts/p029.html"}, {"id": "p030", "book": "国史大纲", "author": "钱穆", "subtitle": "为什么读历史要先有温情？", "title": "读书笔记 ｜《国史大纲》钱穆：为什么读历史要先有温情？", "excerpt": "一部在战火里写成的中国通史，从远古讲到明清。它不只梳理朝代怎么换，更想回答一个问题：一个民族凭什么一次次跌下去又站起来。钱穆的答案很反直觉——不靠制度，靠的是你愿不愿意对自己的历史，先有一份温情与敬意。", "category": "历史", "tags": ["历史爱好者", "通史入门", "传统文化", "爱追问\"为什么\"的人", "对历史一知半解的人", "长期主义者"], "date": "2026-11-21", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p030.html"}, {"id": "p031", "book": "基督山伯爵", "author": "", "subtitle": "你等的14年，全用来算账", "title": "读书笔记 ｜《基督山伯爵》：你等的14年，全用来算账", "excerpt": "一桩本该在婚礼当天圆满的人生，被三个嫉妒他的人联手送进死牢；十四年不见天日之后，他带着一笔从天而降的财富和另一个名字归来，把当年害他的人一个个请进自己挖好的坑里。大仲马写的表面是「爽」，底子却是「一个人被辜负到极点之后，要怎么不把自己也变成怪物」。", "category": "文学小说", "tags": ["被辜负过、想讨回公道的人", "相信「等待」力量的人", "喜欢复仇爽文 / 悬疑的人", "想读懂人性明暗的人", "觉得「君子报仇十年不晚」的人"], "date": "2026-09-04", "c1": "#ffb86b", "c2": "#ff7a9c", "url": "https://kingpine1988-coder.github.io/reading/posts/p031.html"}, {"id": "p032", "book": "天道（遥远的救世主）", "author": "", "subtitle": "你越想靠谁翻身，越翻不了身", "title": "读书笔记 ｜《天道（遥远的救世主）》：你越想靠谁翻身，越翻不了身", "excerpt": "一本披着商战外衣的\"人生算法\"书。它不教你赚钱，而是逼你回答一个问题：困住你的，到底是命，还是你那套默认的活法。", "category": "文学小说", "tags": ["爱商战权谋故事的", "想搞懂\"为什么一直卡住\"的", "在依赖和独立间纠结的人", "喜欢硬核思辨的读者", "想提升认知格局的人"], "date": "2026-08-30", "c1": "#ffc371", "c2": "#ff5f6d", "url": "https://kingpine1988-coder.github.io/reading/posts/p032.html"}, {"id": "p033", "book": "如果历史是一群喵", "author": "肥志", "subtitle": "把五千年历史画成一群猫", "title": "读书笔记 ｜《如果历史是一群喵》肥志：把五千年历史画成一群猫", "excerpt": "一套把帝王将相画成猫咪的国漫历史书：先用可爱把你拉进来，再把两千年的因果与脉络悄悄装进去——原来历史不是背下来的，是看懂的。", "category": "历史", "tags": ["怕历史枯燥的人", "家里有学生", "漫画爱好者", "想给孩子讲历史的人", "碎片时间读者"], "date": "2026-11-18", "c1": "#5fd39a", "c2": "#3aa9c9", "url": "https://kingpine1988-coder.github.io/reading/posts/p033.html"}, {"id": "p034", "book": "实践论", "author": "", "subtitle": "为什么懂了很多道理，还是做不好一件事", "title": "读书笔记 ｜《实践论》：为什么懂了很多道理，还是做不好一件事", "excerpt": "《实践论》是毛泽东最著名的哲学著作之一，专门讲一件所有人都困惑过的事：人的认识到底从哪里来，又怎样才算真的\"懂了\"。它的答案朴素而深刻——认识从实践中来，还要回到实践中去检验。", "category": "毛选与思想", "tags": ["爱学习却难落地的人", "做管理和复盘的人", "对哲学感兴趣的人", "想做到\"知行合一\"的人"], "date": "2026-11-16", "c1": "#4facfe", "c2": "#00f2fe", "url": "https://kingpine1988-coder.github.io/reading/posts/p034.html"}, {"id": "p035", "book": "少有人走的路", "author": "", "subtitle": "你越躲，那道坎越绕不掉", "title": "读书笔记 ｜《少有人走的路》：你越躲，那道坎越绕不掉", "excerpt": "一本被推荐了三十多年的心理经典，开篇第一句就泼冷水：人生苦难重重。它不哄你，也不卖鸡汤——它把\"苦\"当成默认设定，然后告诉你，真正让人长大的，恰恰是把苦接住的那点力气。", "category": "心理与成长", "tags": ["总在拖延的人", "容易情绪内耗的人", "在关系里用力过猛的人", "想变得更扛事的成年人", "心理学入门读者"], "date": "2026-08-23", "c1": "#f6d365", "c2": "#fda085", "url": "https://kingpine1988-coder.github.io/reading/posts/p035.html"}, {"id": "p036", "book": "尼罗河上的惨案", "author": "", "subtitle": "一夜之间，3个人想她死", "title": "读书笔记 ｜《尼罗河上的惨案》：一夜之间，3个人想她死", "excerpt": "一个被许多人爱着、也继承了大笔遗产的年轻女人，在尼罗河蜜月游轮上丢了命。阿加莎把谜底推到一个让人不舒服的角落：最想让她消失的，不是恨她的人，恰恰是\"太爱她\"的人。它真正写的不是一桩情杀，是\"爱\"这个字被用坏的样子——当爱变成占有，温柔和杀意之间，只隔一层纸。", "category": "文学小说", "tags": ["喜欢本格推理 / 阿加莎的人", "想读懂「爱与占有」边界的人", "在亲密关系里感到被控制的人", "总被表面善意带节奏的人", "爱琢磨人性阴暗面的人"], "date": "2026-09-04", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p036.html"}, {"id": "p037", "book": "巴黎圣母院", "author": "", "subtitle": "你信的4张脸，3张是假的", "title": "读书笔记 ｜《巴黎圣母院》：你信的4张脸，3张是假的", "excerpt": "书里最干净的那颗心，长在一副所有人都躲着走的身体里；而那张让全城女人心动的脸，转头就把人推进了死路。一座教堂、一场围观、四个被长相改写命运的人——雨果撕开的不是故事，是你我挑人、信人时那点改不掉的本能。", "category": "文学小说", "tags": ["容易被第一印象带跑的人", "在关系里吃过「看走眼」亏的人", "想读懂群体情绪的人", "喜欢经典文学的人", "对人性善恶好奇的人"], "date": "2026-09-02", "c1": "#ffc371", "c2": "#ff5f6d", "url": "https://kingpine1988-coder.github.io/reading/posts/p037.html"}, {"id": "p038", "book": "影响力的武器", "author": "", "subtitle": "你以为自己做主，其实被6个开关拿捏", "title": "读书笔记 ｜《影响力的武器》：你以为自己做主，其实被6个开关拿捏", "excerpt": "一本书讲透「为什么我们明知道被说服，手还是忍不住按下答应」——6 个几乎刻在人类基因里的顺从开关，看明白了，你才真正拿回选择权。", "category": "心理与成长", "tags": ["做销售、运营、商务的人", "总在直播间忍不住下单的人", "带团队、要会沟通说服的人", "想看清话术套路的人", "想多一层清醒的普通读者"], "date": "2026-08-16", "c1": "#ffb86b", "c2": "#ff7a9c", "url": "https://kingpine1988-coder.github.io/reading/posts/p038.html"}, {"id": "p039", "book": "思考，快与慢", "author": "", "subtitle": "你以为在思考，其实是直觉在替你做主", "title": "读书笔记 ｜《思考，快与慢》：你以为在思考，其实是直觉在替你做主", "excerpt": "这本书不教你「怎么想得更对」，而是先让你看见——自己平时到底是怎么被直觉带着跑的。看懂了脑子里这套双系统，你才第一次拥有「按下暂停键」的可能。", "category": "心理与成长", "tags": ["经常要做判断的人", "想少踩决策坑的普通人", "对「人为什么会犯错」好奇的人", "管理者 / 谈判者"], "date": "2026-08-11", "c1": "#4facfe", "c2": "#00f2fe", "url": "https://kingpine1988-coder.github.io/reading/posts/p039.html"}, {"id": "p040", "book": "悉达多", "author": "", "subtitle": "你拼命寻找的自己，从来不在书里", "title": "读书笔记 ｜《悉达多》：你拼命寻找的自己，从来不在书里", "excerpt": "一个出身最好的年轻人，把能学的都学了、能修的都修了，却发现道理停在脑子里，活不出在身上——直到他跌进红尘又回到河边，才听懂那句话：你，只能成为你自己。", "category": "心理与成长", "tags": ["处在迷茫期的人", "对\"成功模板\"疲劳的人", "想独处思考的人", "三十五岁前后重新找方向的人", "爱文学也爱哲思的人"], "date": "2026-08-15", "c1": "#f78ca0", "c2": "#f9748f", "url": "https://kingpine1988-coder.github.io/reading/posts/p040.html"}, {"id": "p041", "book": "悲惨世界", "author": "", "subtitle": "你以为罪洗不掉，偏有人信你", "title": "读书笔记 ｜《悲惨世界》：你以为罪洗不掉，偏有人信你", "excerpt": "一个偷了一块面包的苦役犯，出狱后一辈子被那张旧判决书追着跑；直到一个主教把被他偷走的银器，又白送还给他，说「你拿着这些去当个好人」。雨果写的不是一个人的命，是「一个人被怎么对待，就会变成什么样的人」——你给他牢笼，他就学坏了；你给他一次不设防的信任，他能把余生都还回去。", "category": "文学小说", "tags": ["容易被「过去」困住的人", "在规则与人情间纠结的人", "想读懂贫穷与尊严的人", "喜欢厚重史诗的人", "相信「人能变好」的人"], "date": "2026-09-04", "c1": "#a18cd1", "c2": "#fbc2eb", "url": "https://kingpine1988-coder.github.io/reading/posts/p041.html"}, {"id": "p042", "book": "愚公移山", "author": "", "subtitle": "为什么\"看起来不可能\"的事，总有人做成", "title": "读书笔记 ｜《愚公移山》：为什么\"看起来不可能\"的事，总有人做成", "excerpt": "《愚公移山》是\"老三篇\"中流传最广的一篇。它借一个古老的寓言，讲了一种看似\"笨\"、实则最有力量的态度：认准了要移的山，就一代一代干下去。这份\"笨功夫\"，恰恰是做成难事的真相。", "category": "毛选与思想", "tags": ["正在啃硬骨头的人", "做长期事业的人", "容易半途而废的人", "需要一点信念感的人"], "date": "2026-11-16", "c1": "#f78ca0", "c2": "#f9748f", "url": "https://kingpine1988-coder.github.io/reading/posts/p042.html"}, {"id": "p043", "book": "放学后", "author": "", "subtitle": "你越护着的学生，越藏着你读不懂的杀意", "title": "读书笔记 ｜《放学后》：你越护着的学生，越藏着你读不懂的杀意", "excerpt": "东野圭吾的成名作，把一个看似最安全的校园，写成了一座密室——你以为的青春美好，可能正藏着最锋利的恶意。微信读书 86.7% 推荐。", "category": "文学小说", "tags": ["推理迷", "东野圭吾读者", "当老师的", "爱悬疑的", "想看人性反转的", "有校园记忆的人"], "date": "2026-08-14", "c1": "#43cea2", "c2": "#185a9d", "url": "https://kingpine1988-coder.github.io/reading/posts/p043.html"}, {"id": "p044", "book": "数学之美", "author": "", "subtitle": "你越堆复杂度，越离答案远", "title": "读书笔记 ｜《数学之美》：你越堆复杂度，越离答案远", "excerpt": "一段语音变成文字、一次翻译跨过上百种语言、一个搜索从亿万网页里捞出你要的那条——背后没有魔法。吴军把这件\"智能\"的外衣一层层扒开，露出的竟是最朴素的概率和统计：越庞大的应用，底层的数学往往越简单。", "category": "投资与商业", "tags": ["怕数学的人", "产品经理", "程序员", "学生", "想看懂 AI 底层逻辑的人"], "date": "2026-11-15", "c1": "#f78ca0", "c2": "#f9748f", "url": "https://kingpine1988-coder.github.io/reading/posts/p044.html"}, {"id": "p045", "book": "文明之光", "author": "", "subtitle": "为什么改变世界的，常常是些\"没用\"的东西？", "title": "读书笔记 ｜《文明之光》：为什么改变世界的，常常是些\"没用\"的东西？", "excerpt": "一部写给普通人的文明简史：从陶器、文字到蒸汽机与互联网，吴军带你看清——真正推动历史往前走的，往往不是那些看似\"有用\"的算计，而是一群人出于好奇、审美和\"不划算\"的执着，悄悄点亮了整个人类。", "category": "投资与商业", "tags": ["对历史感兴趣的人", "科技与艺术爱好者", "做长期主义的人", "想给孩子讲文明的父母"], "date": "2026-11-1 cerpt": "这是在革命处于低潮、不少人信心动摇时写下的一封信。它没有空洞地喊\"要坚持\"，而是冷静分析为什么看似微弱的火种终会成势。真正值得学的，是那种在低谷里依然能做理性趋势判断的能力。", "category": "毛选与思想", "tags": ["创业或做新项目的人", "处在低谷的人", "做战略和判断的人", "需要给自己打气又不想自欺的人"], "date": "2026-11-16", "c1": "#4facfe", "c2": "#00f2fe", "url": "https://kingpine1988-coder.github.io/reading/posts/p050.html"}, {"id": "p051", "book": "星际穿越", "author": "", "subtitle": "你离开1小时，孩子已老7岁", "title": "读书笔记 ｜《星际穿越》：你离开1小时，孩子已老7岁", "excerpt": "一本由真正的诺贝尔奖级物理学家写就的书——它把那部让你哭的电影，从\"看着离谱\"还原成\"算得出来\"。看懂它，你会重新掂量\"时间\"这两个字的分量。", "category": "文学小说", "tags": ["科幻迷", "看完电影想搞懂原理的观众", "对\"时间\"着迷的人", "物理小白但好奇心重", "想给孩子讲宇宙的父母"], "date": "2026-11-07", "c1": "#ffb86b", "c2": "#ff7a9c", "url": "https://kingpine1988-coder.github.io/reading/posts/p051.html"}, {"id": "p052", "book": "月亮与六便士", "author": "", "subtitle": "你守了一辈子的安稳，只是六个便士", "title": "读书笔记 ｜《月亮与六便士》：你守了一辈子的安稳，只是六个便士", "excerpt": "一个四十岁、有妻儿的证券经纪人，突然抛下一切去巴黎画画——毛姆借他的疯，戳破了我们都在演的一出戏：日子过得滴水不漏，灵魂却早被典当。微信读书 90.2% 推荐，不是因为它好读，是因为它扎人。", "category": "文学小说", "tags": ["困在安稳里的上班族", "想转行又不敢的人", "文艺与理想主义者", "三十岁后开始问\"我是谁\"的人"], "date": "2026-08-22", "c1": "#f6d365", "c2": "#fda085", "url": "https://kingpine1988-coder.github.io/reading/posts/p052.html"}, {"id": "p053", "book": "沉默的大多数", "author": "", "subtitle": "你嘴上笑着附和，心里早翻了白眼", "title": "读书笔记 ｜《沉默的大多数》：你嘴上笑着附和，心里早翻了白眼", "excerpt": "一本写于三十年前的杂文集，说的却是今天每个人都躲不开的处境：人群都在笑的时候，你敢不敢不笑；别人把词都替你想好了的时候，你还要不要自己想。", "category": "文学小说", "tags": ["爱较真的人", "总被说\"你想太多\"的人", "在人群里常感格格不入者", "想写点真话的人", "厌倦复制粘贴观点的人"], "date": "2026-08-28", "c1": "#7c9cff", "c2": "#c08cff", "url": "https://kingpine1988-coder.github.io/reading/posts/p053.html"}, {"id": "p054", "book": "沙丘全集", "author": "", "subtitle": "你盼的救世主，要你献祭自由", "title": "读书笔记 ｜《沙丘全集》：你盼的救世主，要你献祭自由", "excerpt": "一部写于半个多世纪前的太空史诗，借一颗沙漠星球的命运，把\"英雄、预言、权力\"这三件事扒开给你看：人们最渴望被拯救的那一刻，往往正是失去自由的开始。", "category": "文学小说", "tags": ["科幻迷", "权力与组织观察者", "长期主义者", "怕被叙事带跑的人", "喜欢宏大世界观的人"], "date": "2026-10-14", "c1": "#ffb86b", "c2": "#ff7a9c", "url": "https://kingpine1988-coder.githu t": "一本被翻烂了三十多年的自我管理经典。它最反常识的地方在于：真正让你\"高效\"的，从来不是再多几个技巧，而是先把看世界的那副透镜擦干净——七个习惯只是壳，由内而外换操作系统，才是内核。", "category": "心理与成长", "tags": ["总觉得时间不够用的人", "想从\"瞎忙\"里跳出来的人", "带团队、想带出主动性的人", "想少点内耗、多点掌控感的人", "职场新人和资深都适用"], "date": "2026-08-24", "c1": "#ffc371", "c2": "#ff5f6d", "url": "https://kingpine1988-coder.github.io/reading/posts/p073.html"}, {"id": "p074", "book": "黄金时代", "author": "", "subtitle": "你最放肆的年纪，却活成了最乖的样子", "title": "读书笔记 ｜《黄金时代》：你最放肆的年纪，却活成了最乖的样子", "excerpt": "一个被发配到边远地方的年轻人，在荒诞年代里死死护住了「活成自己」这点事。它写的不是某段历史，是每个人心里都有的那个问题：你是什么时候，把野性悄悄交出去的。", "category": "文学小说", "tags": ["曾在\"该懂事\"年纪偷偷叛逆过的人", "被说\"你太野了\"的人", "在规矩里喘不过气的人", "怀念某个不顾旁人的自己的人", "想读懂王小波的人"], "date": "2026-08-28", "c1": "#5fd39a", "c2": "#3aa9c9", "url": "https://kingpine1988-coder.github.io/reading/posts/p074.html"}];
const cats = ["全部", ...new Set(POSTS.map(p => p.category))];
const filters = document.getElementById('filters');
cats.forEach(c => { const b=document.createElement('button'); b.textContent=c; b.dataset.cat=c; filters.appendChild(b); });
const grid = document.getElementById('grid'), q = document.getElementById('q'),
      sort = document.getElementById('sort'), empty = document.getElementById('empty');
let activeCat = '全部';
filters.addEventListener('click', e => {
  if(e.target.dataset.cat) { activeCat=e.target.dataset.cat;
    filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===e.target)); render(); }
});
q.addEventListener('input', render);
sort.addEventListener('change', render);
function render() {
  const kw = q.value.trim().toLowerCase();
  let list = POSTS.filter(p => (activeCat==='全部' || p.category===activeCat) &&
    (!kw || (p.book+p.author+p.subtitle+p.excerpt+p.tags.join('')).toLowerCase().includes(kw)));
  if(sort.value==='book') list.sort((a,b)=>a.book.localeCompare(b.book,'zh'));
  else if(sort.value==='old') list.sort((a,b)=>a.date.localeCompare(b.date));
  else list.sort((a,b)=>b.date.localeCompare(a.date));
  grid.innerHTML = list.map(p => `
    <a class="card" href="${p.url}">
      <div class="cover" style="--c1:${p.c1};--c2:${p.c2}"><span>${p.book[0]}</span></div>
      <div class="card-body">
        <div class="cat">${p.category}</div>
        <h3>《${p.book}》</h3>
        <p class="sub">${p.subtitle}</p>
        <p class="excerpt">${p.excerpt}</p>
        <div class="foot"><span>${p.author || '佚名'}</span><span>${p.date}</span></div>
      </div>
    </a>`).join('');
  empty.style.display = list.length ? 'none' : 'block';
}
render();
</script>
